[project]
name = "bittensor-allocation"
version = "0.1.0"
description = "Market-weighted allocation across Bittensor subnets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bittensor==11.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.pyright]
extraPaths = ["src"]
pythonVersion = "3.11"
